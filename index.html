<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Gabung, pisah, kompres, konversi, edit, tanda tangani, dan amankan PDF langsung di peramban.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Atur PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Great+Vibes&family=Homemade+Apple&display=swap">
<style>
/* Layout concept: a workbench of stamped paper. Tools sit in a type-case grid, coloured by drawer (category);
   a tool opens as a sheet with the document on the left and its settings on a side rail. */
:root {
  --paper: #f3f4ef;
  --sheet: #ffffff;
  --ink: #161b18;
  --muted: #5b655f;
  --rule: #dfe3dc;
  --rule-strong: #c4cbc3;
  --stamp: #12664f;
  --stamp-ink: #ffffff;
  --stamp-soft: #e2efe9;
  --danger: #b4232f;
  --warn-bg: #fff4dc;
  --warn-ink: #6b4a00;
  --c-organize: #c2491d;
  --c-optimize: #2f7d32;
  --c-to: #b07400;
  --c-from: #2457c5;
  --c-edit: #7a3fc2;
  --c-security: #b8263f;
  --c-ai: #0f7c8c;
  --shadow: 0 1px 0 rgba(22, 27, 24, .04), 0 6px 18px -10px rgba(22, 27, 24, .25);
  --f-display: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Montserrat', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121614; --sheet: #1a201d; --ink: #e8ece8; --muted: #9aa69f; --rule: #2a322e; --rule-strong: #3a4540;
    --stamp: #4fc79f; --stamp-ink: #0b1a14; --stamp-soft: #17332a; --danger: #ff6b76; --warn-bg: #3a2f12; --warn-ink: #f2d38a;
    --c-organize: #f08a5d; --c-optimize: #6fcf73; --c-to: #e6b44a; --c-from: #7aa2ff; --c-edit: #b892ff; --c-security: #ff7d93; --c-ai: #4fd0e0;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121614; --sheet: #1a201d; --ink: #e8ece8; --muted: #9aa69f; --rule: #2a322e; --rule-strong: #3a4540;
  --stamp: #4fc79f; --stamp-ink: #0b1a14; --stamp-soft: #17332a; --danger: #ff6b76; --warn-bg: #3a2f12; --warn-ink: #f2d38a;
  --c-organize: #f08a5d; --c-optimize: #6fcf73; --c-to: #e6b44a; --c-from: #7aa2ff; --c-edit: #b892ff; --c-security: #ff7d93; --c-ai: #4fd0e0;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 22px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--stamp); }
:focus-visible { outline: 2.5px solid var(--stamp); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.top-inner { max-width: 1240px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
.brand-mark { width: 30px; height: 34px; position: relative; flex: none; }
.brand-mark::before { content: ""; position: absolute; inset: 0 4px 0 0; background: var(--sheet); border: 2px solid var(--ink); border-radius: 3px 9px 3px 3px; }
.brand-mark::after { content: "P"; position: absolute; right: 0; bottom: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--stamp); color: var(--stamp-ink); font-size: 12px; display: grid; place-items: center; font-weight: 800; transform: rotate(-12deg); }
.brand b { color: var(--stamp); }
.search { flex: 1 1 220px; max-width: 420px; margin-left: auto; position: relative; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--rule-strong); border-radius: 999px; background: var(--paper); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }

main { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.intro { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: end; justify-content: space-between; margin-bottom: 22px; }
.intro h1 { font-size: clamp(28px, 4.2vw, 44px); font-weight: 800; letter-spacing: -0.025em; max-width: 18ch; }
.intro h1 em { font-style: normal; color: var(--stamp); }
.intro p { color: var(--muted); max-width: 46ch; margin: 0; }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

.cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.cats button { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 500; font-size: 14px; }
.cats button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 228px), 1fr)); gap: 12px; }
.tcard { --c: var(--stamp); display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; padding: 16px 16px 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); text-decoration: none; color: var(--ink); position: relative; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; min-width: 0; }
.tcard:hover { transform: translateY(-2px); border-color: var(--c); box-shadow: var(--shadow); }
.tcard-name { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
.tcard-desc { color: var(--muted); font-size: 13.5px; line-height: 1.45; }
[data-cat="organize"] { --c: var(--c-organize); } [data-cat="optimize"] { --c: var(--c-optimize); } [data-cat="to"] { --c: var(--c-to); }
[data-cat="from"] { --c: var(--c-from); } [data-cat="edit"] { --c: var(--c-edit); } [data-cat="security"] { --c: var(--c-security); } [data-cat="ai"] { --c: var(--c-ai); }
.ticon { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 9px; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.chip { justify-self: start; font-family: var(--f-mono); font-size: 11px; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; color: var(--c-ai); }
.empty { color: var(--muted); padding: 24px 0; }

/* Tool view */
.tool:not([data-cat]) { --c: var(--stamp); }
.tool-head { display: grid; gap: 12px; margin-bottom: 22px; }
.back { font-size: 14px; text-decoration: none; color: var(--muted); justify-self: start; }
.back:hover { color: var(--ink); }
.tool-title { display: flex; gap: 14px; align-items: center; }
.tool-title .ticon { width: 54px; height: 54px; flex: none; }
.tool-title h1 { font-size: clamp(24px, 3.4vw, 34px); font-weight: 800; letter-spacing: -0.02em; }
.tool-title p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }

.drop-wrap { display: grid; gap: 10px; }
.drop { border: 2px dashed var(--rule-strong); border-radius: 16px; background: var(--sheet); padding: 48px 20px; display: grid; justify-items: center; gap: 12px; text-align: center; transition: border-color .15s, background .15s; }
.drop.hot { border-color: var(--c); background: color-mix(in srgb, var(--c) 6%, var(--sheet)); }
.drop-art .ticon { width: 64px; height: 64px; }
.drop-art svg { width: 38px; height: 38px; }
.drop-hint { color: var(--muted); margin: 0; }
.privacy { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }

.btn { border: 1px solid transparent; border-radius: 9px; padding: 9px 16px; cursor: pointer; font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 40px; }
.btn.primary { background: var(--c, var(--stamp)); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0b1210; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0b1210; } }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--sheet); border-color: var(--rule-strong); color: var(--ink); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.lg { padding: 14px 30px; font-size: 17px; border-radius: 12px; min-height: 52px; }
.btn.sm { padding: 5px 11px; font-size: 13px; min-height: 32px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.busy { position: relative; color: transparent !important; }
.btn.busy::after { content: ""; position: absolute; width: 18px; height: 18px; border: 2.5px solid rgba(255, 255, 255, .5); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.mini { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 6px; min-width: 30px; height: 30px; padding: 0 6px; cursor: pointer; font-size: 14px; line-height: 1; }
.mini:hover { border-color: var(--ink); }
.mini.danger:hover { border-color: var(--danger); color: var(--danger); }
.mini:disabled { opacity: .35; cursor: default; }

.ws { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .ws { grid-template-columns: minmax(0, 1fr); } }
.ws-main { min-width: 0; display: grid; gap: 14px; align-content: start; }
.ws-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
@media (max-width: 860px) { .ws-side { position: static; } }
.ws-side-inner { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.ws-side h3 { font-size: 16px; font-weight: 700; }
.side-foot { display: grid; gap: 10px; border-top: 1px solid var(--rule); padding-top: 14px; margin-top: 4px; }

.flist { display: grid; gap: 8px; }
.fcard, .ocard { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
.ocard { grid-template-columns: auto minmax(0, 1fr) auto; }
.fidx { font-family: var(--f-mono); font-size: 12px; color: var(--muted); width: 18px; text-align: right; }
.fthumb { width: 44px; height: 56px; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; display: grid; place-items: center; background: #fff; }
.fthumb img { width: 100%; height: 100%; object-fit: cover; }
.fext { font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--c, var(--stamp)); background: color-mix(in srgb, var(--c, var(--stamp)) 12%, transparent); padding: 4px 6px; border-radius: 5px; }
.finfo { min-width: 0; }
.fname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fmeta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.factions { display: flex; gap: 4px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.stack { display: grid; gap: 10px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.muted { color: var(--muted); margin: 0; }
.warn { background: var(--warn-bg); color: var(--warn-ink); padding: 10px 12px; border-radius: 8px; font-size: 13.5px; margin: 0; }
.err { color: var(--danger); }

.fieldrow { display: grid; gap: 5px; min-width: 0; flex: 1; }
.fieldrow > label, .lbl { font-size: 13px; font-weight: 600; color: var(--ink); }
.field { width: 100%; padding: 8px 10px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--paper); min-height: 38px; }
.field.sm { width: 72px; }
.field.code { font-family: var(--f-mono); font-size: 13px; line-height: 1.5; resize: vertical; }
textarea.field { resize: vertical; }
.swatch { width: 42px; height: 34px; border: 1px solid var(--rule-strong); border-radius: 8px; padding: 2px; background: var(--paper); cursor: pointer; }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--c, var(--stamp)); width: 16px; height: 16px; flex: none; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; }
.seg-btn { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 8px; padding: 7px 9px; cursor: pointer; text-align: left; display: grid; gap: 1px; }
.seg-btn[aria-checked="true"] { border-color: var(--c, var(--stamp)); background: color-mix(in srgb, var(--c, var(--stamp)) 10%, var(--sheet)); box-shadow: inset 0 0 0 1px var(--c, var(--stamp)); }
.seg-l { font-weight: 600; font-size: 13.5px; }
.seg-d { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.range-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pos9 { display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; }
.pos9 button { height: 34px; border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); cursor: pointer; }
.pos9 button[aria-checked="true"] { background: var(--c, var(--stamp)); color: #fff; border-color: transparent; }
.pos-gap { height: 0; }
details.fold { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; }
details.fold summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details.fold[open] { display: grid; gap: 10px; }

.progress { display: grid; gap: 6px; }
.progress-label { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-track { height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--c, var(--stamp)); transition: width .2s; }

/* Page thumbnails */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.pthumb { background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 10px; padding: 8px; display: grid; gap: 6px; cursor: pointer; user-select: none; position: relative; }
.pgrid.organize .pthumb { cursor: grab; }
.pthumb.sel { border-color: var(--c); box-shadow: inset 0 0 0 1.5px var(--c); }
.pthumb.sel::after { content: "✓"; position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.pthumb.over { border-style: dashed; border-color: var(--c); }
.pthumb-img { aspect-ratio: 1 / 1.3; display: grid; place-items: center; transition: transform .2s; max-width: 100%; }
.pthumb-img img { max-width: 100%; max-height: 100%; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); background: #fff; }
.pthumb-meta { display: flex; justify-content: space-between; align-items: center; gap: 4px; flex-wrap: wrap; }
.pthumb .num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.pthumb-tools { display: flex; gap: 3px; }
.pthumb-tools .mini { min-width: 26px; height: 26px; font-size: 13px; }
.reorder { display: flex; justify-content: center; gap: 4px; }
.reorder .mini { height: 24px; min-width: 34px; }

/* Stage & editor */
.stage { display: grid; gap: 10px; min-width: 0; }
.stage-nav { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.stage-label { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.stage-scroll { overflow: auto; max-width: 100%; background: color-mix(in srgb, var(--ink) 6%, var(--paper)); border-radius: 12px; padding: 16px; display: grid; justify-content: center; }
.stage-frame { position: relative; box-shadow: 0 2px 10px rgba(0, 0, 0, .18); background: #fff; }
.stage-canvas { display: block; }
.stage-overlay { position: absolute; inset: 0; touch-action: none; }
.stage-overlay[data-tool="text"] { cursor: text; }
.stage-overlay[data-tool="pen"] { cursor: crosshair; }
.stage-overlay[data-tool="rect"], .stage-overlay[data-tool="ellipse"], .stage-overlay[data-tool="highlight"], .stage-overlay[data-tool="whiteout"], .stage-overlay[data-tool="redact"], .stage-overlay[data-tool="field"], .stage-overlay[data-tool="check"], .stage-overlay[data-tool="crop"] { cursor: crosshair; }
.edit-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; }
.tool-btn { border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 6px 11px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.tool-btn:hover { background: var(--paper); }
.tool-btn[aria-pressed="true"] { background: var(--c); color: #fff; }
.draw-rect { position: absolute; border: 1.5px dashed #2e6fe3; background: rgba(46, 111, 227, .1); pointer-events: none; }
.draw-rect.redact { background: rgba(0, 0, 0, .55); border-color: #000; }
.draw-rect.crop { border-color: #12664f; background: rgba(18, 102, 79, .12); }
.crop-box { position: absolute; border: 2px solid #12664f; box-shadow: 0 0 0 9999px rgba(10, 20, 15, .45); pointer-events: none; }
.place { position: absolute; outline: 1px dashed rgba(46, 111, 227, .6); touch-action: none; cursor: move; }
.place.selected, .place:focus { outline: 2px solid #2e6fe3; }
.place-del { position: absolute; top: -12px; right: -12px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: #b4232f; color: #fff; font-size: 11px; cursor: pointer; display: none; }
.place-handle { position: absolute; right: -6px; bottom: -6px; width: 12px; height: 12px; background: #2e6fe3; border: 2px solid #fff; border-radius: 3px; cursor: nwse-resize; display: none; }
.place-grip { position: absolute; left: -10px; top: -10px; width: 16px; height: 16px; border-radius: 4px; background: #2e6fe3; display: none; cursor: move; }
.place.selected .place-del, .place:focus .place-del, .place.selected .place-handle, .place:focus .place-handle, .place.selected .place-grip, .place.text:hover .place-grip { display: block; }
.ptext:empty::before { content: attr(data-ph); color: #8a8f8c; }
.place.text { width: auto !important; min-width: 40px; }
.ptext { width: 100%; min-height: 100%; outline: none; white-space: pre; cursor: text; padding: 0 1px; }
.pimg { width: 100%; height: 100%; display: block; pointer-events: none; }
.pshape { width: 100%; height: 100%; }
.field-tag { font: 600 11px var(--f-body); color: #1d4fa8; padding: 1px 4px; white-space: nowrap; overflow: hidden; display: block; }
svg.pen-layer { position: absolute; inset: 0; width: 100%; height: 100%; }
svg.pen-layer polyline { pointer-events: stroke; cursor: pointer; }
svg.pen-layer.live { pointer-events: none; }

/* Signature */
.sig-pad { width: 100%; max-width: 560px; aspect-ratio: 3 / 1; height: auto; background: #fff; border: 1px solid var(--rule-strong); border-radius: 8px; touch-action: none; cursor: crosshair; }
.sig-fonts { display: grid; gap: 6px; }
.sig-font { background: #fff; border: 1px solid var(--rule-strong); border-radius: 8px; padding: 6px 12px; font-size: 30px; cursor: pointer; text-align: left; overflow: hidden; white-space: nowrap; }
.sig-font[aria-pressed="true"] { border-color: var(--stamp); box-shadow: inset 0 0 0 1.5px var(--stamp); }
.dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--sheet); box-shadow: 0 0 0 1px var(--rule-strong); cursor: pointer; }
.sig-shelf { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.sig-item { background: #fff; border: 1px solid var(--rule-strong); border-radius: 8px; padding: 6px; cursor: pointer; height: 64px; }
.sig-item img { max-height: 100%; max-width: 100%; }
.scan-prev { max-width: 100%; border: 1px solid var(--rule); border-radius: 6px; background: #fff; }

/* Result */
.result { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 22px; display: grid; gap: 16px; }
.result-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.result-head h2 { font-size: 24px; font-weight: 800; }
